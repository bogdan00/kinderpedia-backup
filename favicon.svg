<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="diskBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="shutterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <!-- Disk Body with chamfered top-right corner -->
  <path d="M 10 6 
           L 46 6 
           L 54 14 
           L 54 54 
           A 4 4 0 0 1 50 58 
           L 14 58 
           A 4 4 0 0 1 10 54 
           Z" 
        fill="url(#diskBg)" />

  <!-- Metal Shutter at the top -->
  <rect x="20" y="6" width="24" height="20" rx="2" fill="url(#shutterGrad)" />
  <!-- Shutter Slot -->
  <rect x="25" y="10" width="5" height="12" rx="1.5" fill="#0f172a" />

  <!-- Label area at the bottom -->
  <rect x="16" y="32" width="32" height="22" rx="3" fill="#ffffff" />
  <!-- Label lines -->
  <rect x="20" y="36" width="24" height="3" rx="1.5" fill="#38bdf8" />
  <rect x="20" y="42" width="18" height="2.5" rx="1" fill="#94a3b8" />
  <rect x="20" y="47" width="21" height="2.5" rx="1" fill="#cbd5e1" />
</svg>
