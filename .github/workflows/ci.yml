name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-and-typecheck:
    name: Ruff & Mypy (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -e ".[faces,dev]"
      - run: ruff check src tests kinderpedia.py
      - run: mypy src tests kinderpedia.py

  bookmarklet:
    name: Bookmarklet (node --check & layout contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: |
          node --check bookmarklet/kinderpedia-backup.js
          node --check bookmarklet/kinderpedia-backup.min.js
          node --check bookmarklet/serve.js
          node --check bookmarklet/worker.js
      - name: kinderpedia-backup.min.js must be an exact copy of kinderpedia-backup.js
        run: cmp bookmarklet/kinderpedia-backup.js bookmarklet/kinderpedia-backup.min.js
      - name: Shared layout contract (python/tests/fixtures/layout_contract.json)
        run: node --test bookmarklet/tests/layout_contract.test.mjs

  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip && pip install -e ".[faces,dev]"
      - run: pytest -v
