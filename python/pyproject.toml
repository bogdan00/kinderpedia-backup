[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kinderpedia-backup"
version = "1.0.0"
description = "Resumable cloud media backup & local face-organization CLI for Kinderpedia parent accounts."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["kinderpedia", "backup", "photos", "videos", "face-recognition", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.28,<3",
]

[project.optional-dependencies]
# Optional local ML stack for `kinderpedia-backup faces` (kept separate so `sync` stays lightweight).
# onnxruntime is the fast engine (CoreML / CUDA / CPU, ~10x faster than OpenCV DNN on Apple silicon);
# it is skipped on interpreters it does not publish wheels for yet (so installs never break), in which
# case `faces scan` falls back to OpenCV DNN automatically and says so at startup.
faces = [
    "numpy>=1.24",
    "pillow>=10.0",
    "opencv-python-headless>=4.8",
    "onnxruntime>=1.17; python_version < \"3.15\"",
]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.6",
    "types-requests>=2.31",
]

[project.scripts]
kinderpedia-backup = "kinderpedia_backup.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kinderpedia_backup = ["py.typed", "faces/web/*"]

[tool.ruff]
target-version = "py310"
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "E501",   # line length handled pragmatically
    "S311",   # random.uniform used only for retry jitter, not cryptography
    "S603",   # subprocess invoked with fixed argument list (no shell=True) covering ffmpeg/caffeinate
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*", "onnxruntime", "PIL", "PIL.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
